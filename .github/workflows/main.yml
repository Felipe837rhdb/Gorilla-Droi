name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Compilar APK
        run: gradle assembleDebug --no-daemon
      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GorilaDroid.apk
      - name: Publicar na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-mais-recente
          name: Gorila Droid (APK mais recente)
          body: Baixe o arquivo GorilaDroid.apk abaixo e instale no celular.
          files: GorilaDroid.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GorilaDroid-apk
          path: GorilaDroid.apk
