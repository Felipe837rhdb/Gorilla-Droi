plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gorilladroid.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.gorilladroid.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "5.2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // O jogo (game.html) tem ~11 MB: não comprimir evita problemas ao carregar.
    androidResources {
        noCompress 'html'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
